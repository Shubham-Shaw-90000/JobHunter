version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: jobhunter_postgres
    restart: always
    environment:
      POSTGRES_USER: jobhunter 
      POSTGRES_PASSWORD: jobhunter_secret
      POSTGRES_DB: jobhunter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
# named volume
volumes:  
  postgres_data:
